# License gate for GPL-3.0-only. Every crate we link must be compatible.

[licenses]
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-1.1", "Apache-1.0",
    "BSD-2-Clause", "BSD-3-Clause", "BSD-4-Clause",
    "ISC", "Zlib", "CC0-1.0", "Unlicense", "0BSD",
    "Unicode-3.0", "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",   # webpki-roots (rustls trust anchors)
]
confidence-threshold = 0.9
exceptions = [
    # SQLite's amalgamation is public domain (CC0); the wrapper is MIT.
    { allow = ["Zlib", "CC0-1.0", "MIT", "Apache-2.0"], name = "libsqlite3-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Never link OpenSSL or native-tls: rustls only, so the musl build stays static.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
