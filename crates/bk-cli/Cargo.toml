[package]
name = "bk-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
publish = false
authors = ["Vaibhav <thisisforlearn@users.noreply.github.com>"]
description = "`bookmark` CLI: init, serve, watch, user, add, search, crawl, index, export/import, backup, model, doctor, service, update."

[dependencies]
bk-core = { workspace = true }
bk-db = { workspace = true }
bk-crawl = { workspace = true }
bk-search = { workspace = true }
bk-serve = { workspace = true }
bk-ops = { workspace = true }
bk-model = { workspace = true }
bk-infer = { workspace = true }
bk-train = { workspace = true }

clap = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
indicatif = { workspace = true }
rand = { workspace = true }
getrandom = { workspace = true }

[features]
default = []
# Kept as a no-op so `--features train` from older docs/CI still works.
train = []

[[bin]]
name = "bookmark"
path = "src/main.rs"
