# Path-only optional dependency of bk-cli (`--features train`). Pure Rust: no Burn,
# no wgpu, so it builds on every target including Termux.

[package]
name = "bk-train"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
publish = false
authors = ["Vaibhav <thisisforlearn@users.noreply.github.com>"]

[dependencies]
bk-core = { path = "../bk-core" }
bk-model = { path = "../bk-model" }
bk-db = { path = "../bk-db" }
bk-search = { path = "../bk-search" }
bk-infer = { path = "../bk-infer" }
indicatif = "0.18"
tracing = "0.1"
rand = "0.9"


[features]
default = []
cpu = []
wgpu = []
