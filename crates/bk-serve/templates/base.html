<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="csrf-token" content="{{ csrf }}">
<title>{% block title %}bookmark{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="bookmark home">
    <span class="mark" aria-hidden="true">◆</span> bookmark
  </a>
  <div class="topbar-right">
    {% block nav %}{% endblock %}
    <a class="btn ghost" href="/settings">Settings</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn ghost" type="submit">Sign out</button>
    </form>
  </div>
</header>
<main class="page">
{% block content %}{% endblock %}
</main>
<footer class="foot">
  <span>bookmark · self-hosted</span>
</footer>
<script src="/static/app.js" defer></script>
</body>
</html>
