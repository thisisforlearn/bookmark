name: android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already has the SDK; installing only what AGP needs avoids
      # setup-android's attempt to fetch the removed `tools` package.
      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ---- build the embedded server from THIS commit -----------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-embed

      - name: Build server (Android) and models (host)
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a build --release -p bk-cli
          cargo build --release -p bk-cli

          dir=android/app/src/nerd/jniLibs/arm64-v8a
          mkdir -p "$dir"
          cp target/aarch64-linux-android/release/bookmark "$dir/libbookmark.so"
          chmod +x "$dir/libbookmark.so"

          export BOOKMARK_CONFIG="$PWD/ci-config.toml"
          printf 'data_dir = "%s/ci-data"\nmodels_dir = "%s/ci-data/models"\n' "$PWD" "$PWD" > "$BOOKMARK_CONFIG"
          ./target/release/bookmark model train all --mode quick
          for m in spell embed rank; do
            cp "ci-data/models/$m.bkmdl" "$dir/lib$m.so"
          done
          ls -la "$dir"

      # ---- build the app ----------------------------------------------------
      - name: Build both flavors
        working-directory: android
        run: gradle assembleConsumerRelease assembleNerdRelease --no-daemon --stacktrace

      - name: Collect APKs and enforce size budget
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/app/build/outputs/apk/consumer/release/app-consumer-release.apk out/bookmark-consumer.apk
          cp android/app/build/outputs/apk/nerd/release/app-nerd-release.apk out/bookmark-nerd.apk
          ls -lh out
          c=$(stat -c%s out/bookmark-consumer.apk)
          n=$(stat -c%s out/bookmark-nerd.apk)
          echo "consumer: $c bytes"
          echo "nerd:     $n bytes"
          if [ "$c" -gt 5000000 ]; then echo "::error::consumer APK exceeds 5 MB"; exit 1; fi
          if [ "$n" -gt 20000000 ]; then echo "::error::nerd APK exceeds 20 MB"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: bookmark-apk
          path: out/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
