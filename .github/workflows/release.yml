name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}
      # `cross` runs the build inside a container that already has a musl
      # toolchain for the target, including aws-lc-sys and zstd-sys.
      - name: Build
        run: cross build --release -p bk-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          cp "target/${{ matrix.target }}/release/bookmark" "bookmark-${{ matrix.target }}"
          sha256sum "bookmark-${{ matrix.target }}" > "bookmark-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bookmark-${{ matrix.target }}
          path: bookmark-${{ matrix.target }}*
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bookmark-${{ matrix.target }}*
            install.sh
          generate_release_notes: true

  android:
    # Termux/Android: Bionic build so DNS resolution works (Android has no
    # /etc/resolv.conf, which static musl needs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build
        run: cargo ndk -t arm64-v8a build --release -p bk-cli
      - name: Package
        run: |
          cp target/aarch64-linux-android/release/bookmark bookmark-aarch64-linux-android
          sha256sum bookmark-aarch64-linux-android > bookmark-aarch64-linux-android.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: bookmark-aarch64-linux-android*
          generate_release_notes: true

  windows-gnu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The GNU toolchain bundles its own MinGW linker (no Visual Studio needed).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu
      - name: Build (with training)
        shell: bash
        run: cargo +stable-x86_64-pc-windows-gnu build --release -p bk-cli --target x86_64-pc-windows-gnu --features train
      - name: Package
        shell: bash
        run: |
          cp target/x86_64-pc-windows-gnu/release/bookmark.exe bookmark-x86_64-pc-windows-gnu.exe
          sha256sum bookmark-x86_64-pc-windows-gnu.exe > bookmark-x86_64-pc-windows-gnu.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bookmark-x86_64-pc-windows-gnu.exe*
            install.sh
          generate_release_notes: true

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc
      - name: Build (with training)
        run: cargo build --release -p bk-cli --target x86_64-pc-windows-msvc --features train
      - name: Package
        shell: bash
        run: |
          cp target/x86_64-pc-windows-msvc/release/bookmark.exe bookmark-x86_64-pc-windows-msvc.exe
          sha256sum bookmark-x86_64-pc-windows-msvc.exe > bookmark-x86_64-pc-windows-msvc.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: bookmark-x86_64-pc-windows-msvc.exe*
          generate_release_notes: true

  models:
    # Build the default model bundle from the built-in seed vocabulary and
    # attach it so users can `bookmark model install` without training.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build trainer
        run: cargo build --release -p bk-cli
      - name: Train default models
        run: |
          set -euo pipefail
          export BOOKMARK_CONFIG="$PWD/ci-config.toml"
          printf 'data_dir = "%s/ci-data"\nmodels_dir = "%s/ci-data/models"\n' "$PWD" "$PWD" > "$BOOKMARK_CONFIG"
          ./target/release/bookmark model train all --mode quick
          cp ci-data/models/spell.bkmdl ci-data/models/embed.bkmdl ci-data/models/rank.bkmdl .
          sha256sum spell.bkmdl embed.bkmdl rank.bkmdl > models.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            spell.bkmdl
            embed.bkmdl
            rank.bkmdl
            models.sha256
