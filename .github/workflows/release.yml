name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          # Bionic build: Android has no /etc/resolv.conf, so a static musl
          # binary cannot resolve DNS there. Termux users should use this one.
          - aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}
      # `cross` runs the build inside a container that already has a musl
      # toolchain for the target, including aws-lc-sys and zstd-sys.
      - name: Build
        run: cross build --release -p bk-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          cp "target/${{ matrix.target }}/release/bookmark" "bookmark-${{ matrix.target }}"
          sha256sum "bookmark-${{ matrix.target }}" > "bookmark-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bookmark-${{ matrix.target }}
          path: bookmark-${{ matrix.target }}*
      - uses: softprops/action-gh-release@v2
        with:
          files: bookmark-${{ matrix.target }}*
          generate_release_notes: true

  windows-gnu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The GNU toolchain bundles its own MinGW linker (no Visual Studio needed).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu
      - name: Build (with training)
        shell: bash
        run: cargo +stable-x86_64-pc-windows-gnu build --release -p bk-cli --target x86_64-pc-windows-gnu --features train
      - name: Package
        shell: bash
        run: |
          cp target/x86_64-pc-windows-gnu/release/bookmark.exe bookmark-x86_64-pc-windows-gnu.exe
          sha256sum bookmark-x86_64-pc-windows-gnu.exe > bookmark-x86_64-pc-windows-gnu.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bookmark-x86_64-pc-windows-gnu.exe*
            install.sh
          generate_release_notes: true

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc
      - name: Build (with training)
        run: cargo build --release -p bk-cli --target x86_64-pc-windows-msvc --features train
      - name: Package
        shell: bash
        run: |
          cp target/x86_64-pc-windows-msvc/release/bookmark.exe bookmark-x86_64-pc-windows-msvc.exe
          sha256sum bookmark-x86_64-pc-windows-msvc.exe > bookmark-x86_64-pc-windows-msvc.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: bookmark-x86_64-pc-windows-msvc.exe*
          generate_release_notes: true
